<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>FINANCE</title>
<meta name="theme-color" content="#053D2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FINANCE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>try{if(localStorage.getItem('fin_theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<style>
/* Layout idea: deep-green premium finance app; drawer + bottom bar on phones, fixed sidebar on desktop. Single light theme by choice. */
:root{
  --g900:#053D2E; --g800:#07503B; --g700:#0B6E4F; --g500:#1B9A6F; --g100:#DCEFE5; --g50:#EEF7F2;
  --paper:#F6F8F4; --card:#FFFFFF; --ink:#10231B; --muted:#5B6E64; --line:#DDE6DF;
  --gold:#C9A24B; --bad:#B3412F; --badbg:#FBECE8; --warn:#9A6A12; --warnbg:#FBF3DF;
  --display:'Fraunces',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(5,61,46,.06),0 8px 24px rgba(5,61,46,.07);
  color-scheme:light; --surf:#FFFFFF; --gt:#07503B; --topbg:rgba(246,248,244,.92); --badline:#EBC9C1; --warnline:#EBD9A8;
}
html[data-theme=dark]{
  --paper:#0B1511; --card:#13211B; --surf:#13211B; --ink:#E7F2EB; --muted:#9BB0A5; --line:#25392F;
  --g50:#18322A; --g100:#1D3D32; --gt:#5FD3A5; --g700:#2FA77A; --gold:#D9B45E;
  --bad:#EE8A77; --badbg:#3B1F1A; --warn:#E3B755; --warnbg:#392F14; --badline:#5A2E27; --warnline:#5A4A1C;
  --topbg:rgba(11,21,17,.92); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html[data-theme=dark] .ov{background:rgba(0,0,0,.65)}
html[data-theme=dark] .btn.primary,html[data-theme=dark] .chip.on,html[data-theme=dark] .tabb.on,html[data-theme=dark] .qc.main,html[data-theme=dark] .qc .ci,html[data-theme=dark] .tot{--g700:#0B6E4F}
html[data-theme=dark] .seg input:checked+span{background:var(--g100);color:var(--gt)}
html[data-theme=dark] #bottom button.on{color:var(--gt)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,a,label,select{touch-action:manipulation}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input[list]::-webkit-calendar-picker-indicator{display:none!important}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(27,154,111,.45);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;min-height:100%}
/* sidebar */
#side{position:fixed;inset:0 auto 0 0;width:284px;max-width:86%;background:linear-gradient(180deg,var(--g900),#032A20);color:#fff;z-index:40;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding:22px 16px;overflow:auto}
#side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
#scrim{position:fixed;inset:0;background:rgba(3,30,22,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
#scrim.on{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--surf)!important;display:grid;place-items:center;padding:8px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.06em;display:block}
.brand small{opacity:.7;font-size:11.5px}
.navgrp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:rgba(255,255,255,.82);padding:12px;border-radius:12px;text-align:left;font-weight:600}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.deskonly{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-size:20px;flex:1}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--gt)}
.ib:hover{background:var(--g50)}
#view{flex:1;padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--surf);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#bottom button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:14px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
#bottom button.on{color:var(--gt);background:var(--g50)}
@media(min-width:960px){
  #side{transform:none;width:268px}
  #app{padding-left:268px}
  #scrim{display:none}
  #bottom{display:none}
  .menubtn{display:none}
  .deskonly{display:block}
  #view{padding:26px 32px 60px}
  .top{padding:16px 32px}
}
/* generic */
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel{padding:18px}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec{font-family:var(--display);font-size:18px;margin:26px 0 12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--surf);padding:11px 16px;font-weight:700;color:var(--gt);text-decoration:none;min-height:44px}
.btn:hover{background:var(--g50)}
.btn.primary{background:linear-gradient(145deg,var(--g700),var(--g800));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--badline)}
.btn.danger.fill{background:var(--bad);color:#fff;border-color:transparent}
.btn.wa{background:#1FA855;color:#fff;border-color:transparent}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:11px}
/* dashboard cards */
.cards3{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.cards3{grid-template-columns:repeat(3,1fr)}}
.fcard{position:relative;overflow:hidden;text-align:left;border:0;border-radius:22px;padding:20px 20px 18px;color:#fff;min-height:148px;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 30px rgba(5,61,46,.22)}
.fcard::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%)}
.fcard.income{background:linear-gradient(135deg,#0F8A62,#0B6E4F 60%,#08583F)}
.fcard.expense{background:linear-gradient(135deg,#0B6E4F,#08523B 60%,#053D2E)}
.fcard.balance{background:linear-gradient(135deg,#07503B,#053D2E 55%,#032A20);box-shadow:0 14px 30px rgba(3,42,32,.35),inset 0 -3px 0 var(--gold)}
.fcard .lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;opacity:.9}
.fcard .lab .ch{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.fcard .big{font-family:var(--display);font-weight:600;font-size:clamp(28px,6vw,34px);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}
.fcard .more{margin-top:auto;font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:4px}
.fcard .more svg{width:14px;height:14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:760px){.qa{grid-template-columns:repeat(4,1fr)}}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:12px;border:1px solid var(--line);background:var(--surf);border-radius:18px;padding:16px;font-weight:700;text-align:left;box-shadow:var(--shadow)}
.qbtn:hover{border-color:var(--g500)}
.qbtn .ci{width:42px;height:42px;border-radius:13px;background:var(--g50);color:var(--gt);display:grid;place-items:center}
.grid2{display:grid;gap:14px;grid-template-columns:1fr;margin-top:26px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.bars .b{margin-bottom:14px}
.bars .bl{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;margin-bottom:5px}
.track{height:8px;border-radius:99px;background:var(--g50);overflow:hidden;margin-bottom:4px}
.track i{display:block;height:100%;border-radius:99px;background:var(--g500)}
.track.x i{background:#C0553F}
.sk{display:inline-block;width:120px;height:.9em;border-radius:6px;background:rgba(255,255,255,.25);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.35}}
/* dashboard summary + quick actions */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{border:0;border-radius:16px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px;min-width:0}
.sc.inc{background:var(--g700)}.sc.exp{background:var(--g800)}
.sc.bal{grid-column:1/-1;background:var(--g900);padding:16px;min-height:98px}
.sc .sl{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;opacity:.92}
.sc .sl svg{width:17px;height:17px}
.sc .sv{font-family:var(--display);font-weight:600;font-size:clamp(17px,5vw,23px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.sc.bal .sv{font-size:clamp(26px,7.5vw,34px)}
.sc .sh{margin-top:auto;font-size:11.5px;opacity:.7}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;text-align:left;min-height:56px;min-width:0}
.qc:hover{border-color:var(--g500)}
.qc.main{grid-column:1/-1;background:var(--g800);border-color:var(--g800);color:#fff;min-height:68px;font-size:16px;padding:12px 16px}
.qc.main .ci{background:rgba(255,255,255,.16);width:42px;height:42px}
.qc .ci{width:36px;height:36px;border-radius:11px;background:var(--g800);color:#fff;display:grid;place-items:center;flex:none}
.qc .ci svg{width:19px;height:19px}
.lockcard{background:var(--g900);color:#fff;border-radius:16px;padding:16px}
.lockcard span{font-size:12.5px;opacity:.8}.lockcard b{display:block;font-family:var(--display);font-size:clamp(26px,7vw,32px);margin-top:2px}
/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
.row .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.inc{background:var(--g100);color:var(--gt)}
.ico.exp{background:var(--badbg);color:var(--bad)}
.ico.stk{background:var(--warnbg);color:var(--warn)}
.rmain{flex:1;min-width:0}
.rt{font-weight:700;overflow-wrap:anywhere}
.rs{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--g50);color:var(--gt);border:1px solid var(--g100)}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
.tag.ok{background:var(--g100);color:var(--gt)}
.ramt{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ramt.inc{color:var(--gt)}.ramt.exp{color:var(--bad)}
.racts{display:flex;gap:4px;flex-direction:column}
@media(min-width:560px){.racts{flex-direction:row}}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--gt)}
.mini:hover{background:var(--g50)}
.mini.d{color:var(--bad)}
.mini svg{width:17px;height:17px}
.rowwrap{display:flex;flex-direction:column;gap:2px}
@media(max-width:520px){.row{flex-wrap:wrap}.rmain{flex-basis:calc(100% - 60px)}.ramt{margin-left:52px;flex:1;text-align:left}}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.6)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* tabs & chips */
.chips,.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip,.tabb{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--muted)}
.chip.on,.tabb.on{background:var(--g800);color:#fff;border-color:var(--g800)}
button.row,button.ms{font:inherit;color:inherit;cursor:pointer}
.pbar{height:7px;background:var(--g100);border-radius:9px;overflow:hidden;margin-top:7px}.pbar i{display:block;height:100%;background:var(--g700);border-radius:9px}
.row .rmain{min-width:0}
button.row.__x,button.ms.__x{font:inherit;color:inherit;cursor:pointer}
.tabs{margin:16px 0 14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ms{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ms span{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ms b{display:block;font-family:var(--display);font-size:clamp(15px,4vw,22px);margin-top:2px;font-variant-numeric:tabular-nums}
.ms.i b{color:var(--gt)}.ms.e b{color:var(--bad)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:12px 0}
.toolbar .wide{grid-column:1/-1}
@media(min-width:900px){.toolbar{grid-template-columns:2fr 1fr 1fr 1fr}.toolbar .wide{grid-column:auto}}
.sbox{position:relative}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox input{padding-left:40px}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label,.lbl{font-size:12.5px;font-weight:700;color:var(--gt);letter-spacing:.02em}
input[type=text],input[type=tel],input[type=date],input[type=month],input[type=number],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surf);border-radius:13px;padding:11px 13px;min-height:46px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--g500);outline:none;box-shadow:0 0 0 4px rgba(27,154,111,.14)}
input[readonly]{background:var(--g50);color:var(--gt);font-weight:700}
.bad{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:12.5px;min-height:0}
.hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--g50);border-radius:13px;padding:4px;gap:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:10px;font-weight:700;color:var(--muted);font-size:14px}
.seg input:checked+span{background:var(--surf);color:var(--gt);box-shadow:0 1px 4px rgba(5,61,46,.15)}
.seg input:focus-visible+span{outline:3px solid rgba(27,154,111,.45)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--g700)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:calc(-1px - env(safe-area-inset-bottom));background:var(--surf);padding:12px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 12px -8px rgba(5,61,46,.08);z-index:2}
.actions .btn{flex:1}
@media(min-width:560px){.actions .btn{flex:none;min-width:130px}}
.ferr{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:13.5px}
/* sheets */
.ov{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(3,30,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s}
.sheet{background:var(--surf);width:100%;max-width:580px;max-height:calc(100% - 10px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-padding-top:72px;scroll-padding-bottom:104px;border-radius:26px 26px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet.wide{max-width:760px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;padding:6px 26px 24px}}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--surf);padding:16px 0 12px;z-index:2}
.shh h2{font-family:var(--display);font-size:21px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.bk:last-child{border-bottom:0}
.bk b.n{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.bk .sub{font-size:12px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--g800);color:#fff;margin-top:12px;font-weight:700}
.tot b{font-family:var(--display);font-size:19px}
.rcpt{border:1.5px solid var(--g100);border-radius:18px;overflow:hidden}
.rcpt .rh{background:linear-gradient(135deg,var(--g700),var(--g900));color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.rcpt .rh b{font-family:var(--display);font-size:22px;letter-spacing:.06em}
.rcpt .rb{padding:8px 18px 16px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.kv.amt span:last-child{font-family:var(--display);font-size:20px;color:var(--gt)}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bt .btn{flex:1;min-width:130px}
/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
@media(min-width:960px){#toasts{bottom:26px}}
.toast{background:var(--g900);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:460px;animation:up .25s}
.toast.bad{background:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warnbg);color:var(--warn);font-weight:600;margin-bottom:14px;font-size:13.5px}
.banner.bad{background:var(--badbg);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
.dot.on{background:#1FA855;box-shadow:0 0 0 4px rgba(31,168,85,.18)}
.dot.err{background:var(--bad)}
.dot.wait{background:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.yr{margin-top:16px}
.yr h4{margin:0 0 6px;display:flex;justify-content:space-between;font-family:var(--display);font-size:17px}
.grid-set{display:grid;gap:14px}
@media(min-width:900px){.grid-set{grid-template-columns:1fr 1fr}}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:0}
.more-wrap{text-align:center;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* history */
.htabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.htab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--gt);font-weight:800;font-size:13px;letter-spacing:.05em}
.htab svg{width:18px;height:18px}
.htab.on{background:var(--g800);border-color:var(--g800);color:#fff;box-shadow:0 4px 12px rgba(5,61,46,.22)}
.hsearch input[type=search]{min-height:48px;border-radius:16px;padding-left:42px}
.hfp .fld{min-width:0}.hfp input,.hfp select{min-width:0;max-width:100%}
.hbar{display:flex;gap:10px;margin:12px 0 4px}
.hfbtn{flex:1;justify-content:flex-start;background:var(--g50);border-color:var(--g100)}
.hfbtn .hchev{margin-left:auto;display:grid;transition:transform .2s;transform:rotate(90deg)}
.hfbtn.open .hchev{transform:rotate(-90deg)}
.hbadge{background:var(--g800);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.hclr{flex:1;background:var(--g100);color:var(--gt);border-color:var(--g100)}
.hbar .hfbtn:not(.grow){flex:1}
.hfp{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 14px 2px;margin:8px 0}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.hchips:not(:empty){margin:10px 0 2px}
.hchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g100);background:var(--g100);color:var(--gt);border-radius:99px;padding:6px 8px 6px 12px;font-weight:700;font-size:12.5px;max-width:100%}
.hchip svg{width:14px;height:14px}
.hsum{font-size:13px;margin:12px 2px 10px;font-weight:600}
.hc{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px 0;box-shadow:var(--shadow)}
.hct{display:flex;gap:12px;align-items:flex-start}
.hct .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.htags{margin-top:8px}
.hc .ramt.inc{color:#0E8159}
html[data-theme=dark] .hc .ramt.inc{color:var(--gt)}
.hcm{flex:1;min-width:0}
.hct .ramt{flex:none;font-size:17px;padding-top:1px}
.hsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcd{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.hcd span{display:inline-flex;align-items:center;gap:5px}
.hcd svg{width:15px;height:15px}
.hcv{display:flex;align-items:center;justify-content:flex-end;gap:4px;width:100%;margin-top:10px;padding:10px 0 12px;border:0;border-top:1px solid var(--line);background:none;color:var(--gt);font-weight:800;font-size:13.5px}
.hcv svg{width:17px;height:17px}
.hexp{border-radius:99px;padding:11px 26px;color:var(--gt)}
.hdact{flex-wrap:wrap}
.hdact .btn{flex:1 1 auto}

/* settings */
.stg{display:grid;gap:14px}
.stp{padding:16px 16px 18px;border-radius:20px}
.sth{justify-content:flex-start!important;gap:12px!important;font-size:17px!important;margin-bottom:12px!important;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sti{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--g50);color:var(--gt);flex:none}
.sti svg{width:20px;height:20px}
.stfull{width:100%;justify-content:center;min-height:46px;margin-top:10px}
.stp .stat{padding:10px 0;font-size:14px}.stp .stat b{text-align:right;margin-left:14px}
.stdb{display:inline-flex;align-items:center;gap:8px}
.stx.on{color:#12853F}.stx.err{color:var(--bad)}
html[data-theme=dark] .stx.on{color:#4ADE80}
.stmeta{display:grid;gap:2px;margin-top:12px;font-size:12px;color:var(--muted)}
.stbt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stbt .btn{justify-content:center;text-align:center;line-height:1.2;padding:10px;min-height:46px}
.stdz{border-color:var(--badline)}
.stdz .sti{background:var(--badbg);color:var(--bad)}
.stdz .sth{color:var(--ink)}
.stwipe{background:var(--badbg);margin-top:0}
.stab .stat{padding:7px 0;font-size:13.5px}.stab .sth{margin-bottom:6px}
.stp .field{margin-bottom:10px}

/* offers */
.ofTabs{margin:0 0 12px!important;padding-bottom:10px!important}
.ofTabs .tabb{padding:7px 14px;font-size:13px}
.ofsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ofsc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 6px 12px;text-align:center;box-shadow:var(--shadow);min-width:0}
.ofsi{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g100);color:var(--gt);margin:0 auto 6px}
.ofsi svg{width:20px;height:20px}
.ofsc span{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.ofsc b{display:block;font-family:var(--display);font-size:clamp(14px,4.4vw,19px);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ofsc.i b{color:#0E8159}html[data-theme=dark] .ofsc.i b{color:var(--gt)}
.ofsc.w .ofsi{background:var(--warnbg);color:var(--warn)}.ofsc.w b{color:#C2570C}html[data-theme=dark] .ofsc.w b{color:var(--warn)}
.ofsearch{margin:14px 0 10px}.ofsearch input[type=search]{min-height:48px;border-radius:16px;padding-left:42px}
.offl{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px}
.ofsel{position:relative;display:flex;align-items:center;gap:6px;min-height:46px;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:0 8px;color:var(--gt);font-weight:700;font-size:12px;min-width:0}
.ofsel>svg{width:16px;height:16px;flex:none}
.ofsel select{border:0;background:transparent;padding:0;min-height:44px;width:100%;min-width:0;font-weight:700;font-size:12px;color:var(--gt);text-overflow:ellipsis;-webkit-appearance:none;appearance:none;background-image:none}
.ofsel:has(select)::after{content:'';flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-right:2px;pointer-events:none}
.ofmorebtn{justify-content:center;padding:0;gap:3px}.ofmorebtn .hbadge{min-width:16px;height:16px;font-size:10px;padding:0 4px}
.ofpills{margin-top:12px;scrollbar-width:none}.ofpills::-webkit-scrollbar{display:none}
.ofc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.ofc+.ofc{margin-top:10px}
.ofct{display:flex;gap:10px;align-items:flex-start}
.ofct .ico{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.ofcm{flex:1;min-width:0}
.ofcm .rs{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ofcm .rs svg{width:14px;height:14px;flex:none}
.ofmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofdots{flex:none;width:30px;height:34px;border:0;background:none;color:var(--muted);border-radius:10px;display:grid;place-items:center;margin:-4px -6px 0 0}
.ofdots svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ofcb{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:8px}
.ofamt{flex:none}.ofamt b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.ofamt span{font-size:12.5px;color:var(--muted);font-family:var(--display)}
.ofpg{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ofpg .pbar{width:100%;margin:0;height:8px}
.ofst{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-weight:800;font-size:12.5px;white-space:nowrap}
.ofst svg{width:16px;height:16px}
.ofst.ok{background:var(--g100);color:var(--gt)}.ofst.warn{background:var(--warnbg);color:var(--warn)}.ofst.bad{background:var(--badbg);color:var(--bad)}
.ofrem{margin-top:8px;font-size:12px;font-weight:700;color:var(--warn);display:flex;align-items:center;gap:6px}.ofrem svg{width:14px;height:14px}
#offAdd{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;font-size:14.5px;white-space:nowrap}
.ofmi{text-align:left;width:100%}
</style>

function totals(org){
  const I=data.income.filter(inOrg(org)),E=data.expense.filter(inOrg(org));
  const inc=sumP(I),exp=sumP(E);
  return{inc,exp,bal:inc-exp,incCash:sumP(I.filter(x=>x.payType==='Cash')),incAcc:sumP(I.filter(x=>x.payType==='Account')),
    expCash:sumP(E.filter(x=>x.payType==='Cash')),expAcc:sumP(E.filter(x=>x.payType==='Account')),nI:I.length,nE:E.length};
}
function stockSummary(org,from,to){
  const m=new Map();
  const add=(x,k)=>{
    if(!inOrg(org)(x))return;
    const key=x.org+'|'+x.itemKey+'|'+ik(x.unit);
    let e=m.get(key);if(!e){e={org:x.org,item:x.item,unit:x.unit,itemKey:x.itemKey,in:0,used:0,pin:0,pused:0};m.set(key,e)}
    if(!to||x.date<=to){e[k]+=x.qtyMilli}
    if((!from||x.date>=from)&&(!to||x.date<=to)){e[k==='in'?'pin':'pused']+=x.qtyMilli}
  };
  data.stockin.forEach(x=>add(x,'in'));data.stockuse.forEach(x=>add(x,'used'));
  return [...m.values()].map(e=>Object.assign(e,{bal:e.in-e.used})).sort((a,b)=>a.org.localeCompare(b.org)||a.item.localeCompare(b.item));
}
function available(org,item,unit){
  const e=stockSummary(org).find(s=>s.itemKey===ik(item)&&ik(s.unit)===ik(unit));return e?e.bal:0;
}
function followup(s){
  const d=(s.donations||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!d.length)return{st:'none',label:'No donations yet',diff:0,last:null};
  const last=d[0],now=hijriOf(today()),diff=(now.y*12+now.m)-(last.hijriYear*12+last.hijriMonth);
  if(diff>12)return{st:'overdue',label:'Overdue by '+(diff-12)+(diff-12===1?' month':' months'),diff,last};

  if(diff>=9)return{st:'soon',label:'Due in '+(12-diff)+(12-diff===1?' month':' months'),diff,last};
  return{st:'ok',label:'Up to date',diff,last};
}

function dupMsg(x){return 'This looks like a duplicate of a record already saved on '+fmtDate(x.date)+'. It was not saved again.'}
async function nextReceipt(org){
  if(db.nextCounter){const used=new Set(data.income.filter(x=>x.org===org).map(x=>x.receiptNo));const n=await db.nextCounter(org,used);return org+'-'+pad(n,4)}
  const ref=db.doc('meta/counters');
  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder:HOLDER,ttlMs:8000});
    if(r.acquired){
      const s=await ref.get();const c=s.exists?s.data():{};
      let n=(c[org]||0)+1;const used=new Set(data.income.filter(x=>x.org===org).map(x=>x.receiptNo));
      while(used.has(org+'-'+pad(n,4)))n++;
      await ref.set(Object.assign({},c,{[org]:n}));
      return org+'-'+pad(n,4);
    }
    await sleep(300+Math.random()*400);
  }
  throw new Error('Could not reserve a receipt number. Wait a moment and save again.');
}
async function addDonation(s){ // s:{name,phone,address,donation}
  const id='p'+s.phone,ref=db.doc('supporters/'+id);
  const ex=data.supporters.find(x=>x.id===id);
  if(ex){
    const dups=(ex.donations||[]).some(d=>(s.donation.incomeId&&d.incomeId===s.donation.incomeId)||(d.date===s.donation.date&&d.purpose===s.donation.purpose&&(d.amountPaise||0)===(s.donation.amountPaise||0)));
    if(dups)return 'dup';
    await ref.update({donations:(ex.donations||[]).concat([s.donation]),address:ex.address||s.address||'',gender:ex.gender||s.gender||'',whatsapp:ex.whatsapp||s.whatsapp||'',relation:ex.relation||s.relation||''});
    return 'added';
  }
  await ref.set({name:s.name,phone:s.phone,address:s.address||'',gender:s.gender||'',whatsapp:s.whatsapp||'',relation:s.relation||'',createdAt:Date.now(),donations:[s.donation]});
  return 'created';
}
function mkDonation(date,purpose,amountPaise,org,incomeId,hm,hy){
  const h=hm&&hy?{m:hm,y:hy}:hijriOf(date);
  const d={id:Math.random().toString(36).slice(2,10),date,hijriMonth:h.m,hijriYear:h.y,purpose,amountPaise:amountPaise||0};
  if(org)d.org=org;if(incomeId)d.incomeId=incomeId;return d;
}

async function delRecord(col,id){
  if(!needDb())return;const x=data[col].find(r=>r.id===id);if(!x)return;
  if(col==='income'&&x.category==='OFFER COLLECTION'){toast('This income comes from an Offer collection. Delete the collection in Offers.',true);return}
  if(col==='stockin'){const e=stockSummary('ALL').find(s=>s.org===x.org&&s.itemKey===x.itemKey&&ik(s.unit)===ik(x.unit));
    if(e&&e.bal-x.qtyMilli<0){toast('Cannot delete: '+fmtQty(e.used)+' '+x.unit+' of '+x.item+' has already been used. Remove the usage first.',true);return}}
  const what={income:'this income entry',expense:'this expense entry',stockin:'this stock-in entry',stockuse:'this stock usage entry'}[col];
  if(!await confirmBox('Delete '+what+'? This cannot be undone.'))return;
  try{
    await db.doc(col+'/'+id).delete();
    if(col==='income'&&x.supporterId){const sp=data.supporters.find(s=>s.id===x.supporterId);
      if(sp&&(sp.donations||[]).some(d=>d.incomeId===id))await db.doc('supporters/'+sp.id).update({donations:sp.donations.filter(d=>d.incomeId!==id)})}
    toast('Deleted.');
  }catch(e){toast('Could not delete. Try again.',true)}
}

/* ============ OFFERS: promised amounts collected in instalments ============
   offers / offer_cols / offer_log are separate collections. Every instalment is
   mirrored by ONE income entry with the fixed id 'oc_<collectionId>' (category

let ofSyncing=false,ofTimer=null;
function ofSyncSoon(){clearTimeout(ofTimer);ofTimer=setTimeout(ofSync,1500)}
async function ofSync(){
  if(ofSyncing||!db||dbStatus!=='connected'||!ofSynced.offers||!ofSynced.offer_cols)return;
  ofSyncing=true;
  try{
    for(const c of data.offer_cols.slice()){
      const cur=data.income.find(x=>x.id===ofIncId(c.id));
      if(c.deleted){if(cur)await db.doc('income/'+cur.id).delete();await db.doc('offer_cols/'+c.id).delete();continue}
      const o=data.offers.find(x=>x.id===c.offerId);if(!o)continue;
      const w=ofIncomeDoc(o,c);if(ofDiff(cur,w))await db.doc('income/'+ofIncId(c.id)).set(w);
    }
  }catch(e){}finally{ofSyncing=false}

  return data.offers.map(o=>Object.assign({o},ofStat(o))).filter(r=>{
    const o=r.o;
    if(q&&!(ik(o.name).includes(q)||(qd&&((o.phone||'').includes(qd)||(o.whatsapp||'').includes(qd)))))return false;
    if(z.hm&&String(o.hijriMonth)!==z.hm)return false;

    if(z.f==='soon')return r.upcoming;return true;

}

let ofPersonOv=null;
async function ofClick(e){
  const t=e.target.closest('[data-of]');if(!t)return;
  const a=t.dataset.of,id=t.dataset.id,k=t.dataset.k,z=state.of;
  try{switch(a){
    case 'tab':z.tab=k;views.offers.update();window.scrollTo(0,0);break;
    case 'flt':z.f=k;z.limit=60;views.offers.fill();break;
    case 'more':z.limit+=60;views.offers.fill();break;
    case 'add':openOffer();break;
    case 'omenu':ofMenu(id);break;
    case 'omore':z.mopen=!z.mopen;views.offers.fill();break;
    case 'person':openOfferPerson(id);break;
    case 'o-edit':{const o=data.offers.find(x=>x.id===id);if(o)openOffer(o);break}
    case 'o-del':await ofDelOffer(id);break;
    case 'renew':{const o=data.offers.find(x=>x.id===id);if(o){const now=hijriOf(today()),m=+z.yhm||o.hijriMonth;openOffer(null,{pre:Object.assign({},o,{amountPaise:o.amountPaise,hijriMonth:m,hijriYear:now.y+(m<now.m?1:0),offerDate:today(),remindDate:'',notes:''})})}break}
    case 'col-add':{const o=data.offers.find(x=>x.id===id);if(o)openCollection(o);break}
    case 'col-edit':{const c=data.offer_cols.find(x=>x.id===id);const o=c&&data.offers.find(x=>x.id===c.offerId);if(o)openCollection(o,c);break}
    case 'col-del':await ofDelCol(id);break;
    case 'receipt':{const c=data.offer_cols.find(x=>x.id===id),inc=c&&data.income.find(x=>x.id===ofIncId(c.id));if(inc)openReceipt(inc);else toast('The income entry is still being created. Try again in a moment.',true);break}
    case 'pstmt':{const o=data.offers.find(x=>x.id===id);if(o)await szExport(()=>ofPersonPdf(o),'Offer_Statement_'+o.name.replace(/[^\w]+/g,'_')+'.pdf');break}
    case 'rep':await ofReport(k);break;
    case 'pl-move':await ofMovePledge(id);break;
  }}catch(err){toast((err&&err.message)||'Something went wrong.',true)}
}

function openOffer(rec,opts){

   <div class="row2"><div class="fld"><label for="hm">Arabic Month</label><select id="hm">${HM.map((m,i)=>`<option value="${i+1}"${i+1===(r.hijriMonth||h0.m)?' selected':''}>${esc(m)}</option>`).join('')}</select></div>${field('hy','Arabic Year',{type:'number',value:r.hijriYear||h0.y,attrs:'min="1300" max="1600" inputmode="numeric"'})}</div>
   <div class="fld"><label for="em">English Month</label><select id="em">${MONL.map((m,i)=>`<option value="${i+1}"${i+1===(r.engMonth||e0)?' selected':''}>${m}</option>`).join('')}</select></div>
   ${field('name','Name',{value:r.name,attrs:'autocomplete="off" maxlength="80"'})}
   ${field('phone','Phone Number',{type:'tel',value:r.phone,attrs:'inputmode="numeric" maxlength="16" placeholder="10-digit mobile"'})}
   ${field('wa','WhatsApp Number',{type:'tel',value:r.whatsapp,attrs:'inputmode="numeric" maxlength="16" placeholder="10-digit mobile"'})}
   ${field('address','Address',{tag:'textarea',value:r.address,attrs:'maxlength="200"'})}
   ${field('amount','Total Offer Amount (₹)',{value:r.amountPaise?(r.amountPaise/100).toFixed(2):'',attrs:'inputmode="decimal" placeholder="0.00"',hint:edit&&st.rec?'Already received '+fmt(st.rec)+'. The offer cannot be lower than this.':''})}
   ${edit?'':field('rnow','Amount Received Now (₹)',{attrs:'inputmode="decimal" placeholder="0.00"',hint:'Optional. If money is received along with the offer, enter it here. It is added to Total Income at once.'})+paySeg('Cash')+`<div id="txnWrap">${field('txn','UPI ID / Transaction ID',{attrs:'autocomplete="off" maxlength="60"'})}</div>`}
   ${field('remind','Reminder Date',{type:'date',value:r.remindDate,hint:'Optional. The offer shows under Upcoming Reminder from a week before this date.'})}
   ${field('notes','Notes',{tag:'textarea',value:r.notes,attrs:'maxlength="300"'})}
   ${actionsHtml('Save Offer')}</form>`);
  const psync=()=>{const w=$('#txnWrap',s);if(w)w.style.display=$('input[name=pay]:checked',s).value==='Account'?'':'none'};
  $$('input[name=pay]',s).forEach(i=>i.addEventListener('change',psync));psync();
  let touched=!!opts.pre&&!edit;
  $('#hm',s).addEventListener('change',()=>touched=true);$('#hy',s).addEventListener('input',()=>touched=true);$('#em',s).addEventListener('change',()=>touched=true);
  $('#date',s).addEventListener('change',()=>{const v=$('#date',s).value;if(isoOk(v)&&!touched){const h=hijriOf(v);$('#hm',s).value=h.m;$('#hy',s).value=h.y;$('#em',s).value=+v.slice(5,7)}});
  bindForm(s,async()=>{
    let ok=true;const o=val(s,'org'),name=val(s,'name'),ph=val(s,'phone'),wr=val(s,'wa'),date=val(s,'date'),hm=parseInt(val(s,'hm'),10),hy=parseInt(val(s,'hy'),10),em=parseInt(val(s,'em'),10),amt=parseMoney(val(s,'amount')),remind=val(s,'remind');
    if(!o)ok=fail(s,'org','Choose the organization.');
    if(!isoOk(date)||date>today())ok=fail(s,'date','Pick a date that is today or earlier.');
    if(!(hy>=1300&&hy<=1600))ok=fail(s,'hy','Enter an Arabic year between 1300 and 1600.');
    if(name.length<2)ok=fail(s,'name','Enter the name.');
    if(ph&&!normPhone(ph))ok=fail(s,'phone','Enter a valid 10-digit mobile number.');
    if(wr&&!normPhone(wr))ok=fail(s,'wa','Enter a valid 10-digit WhatsApp number.');
    if(!amt)ok=fail(s,'amount','Enter an amount greater than zero, up to 2 decimals.');
    if(remind&&!isoOk(remind))ok=fail(s,'remind','Pick a valid reminder date.');
    if(!ok)return false;
    const phone=ph?normPhone(ph):'',wa=wr?normPhone(wr):'';
    if(edit&&amt<st.rec)return fail(s,'amount','Already received '+fmt(st.rec)+'. The offer cannot be lower than this.');
    const rnRaw=edit?'':val(s,'rnow'),rnAmt=rnRaw?parseMoney(rnRaw):0,rpay=edit?'Cash':$('input[name=pay]:checked',s).value,rtxn=edit?'':val(s,'txn');
    if(rnRaw&&!rnAmt)return fail(s,'rnow','Enter a valid amount or leave it empty.');
    if(rnAmt>amt)return fail(s,'rnow','The amount received cannot be more than the offer.');

        await db.doc('offer_cols/'+cid).set(cd);await ofPutIncome(full,Object.assign({id:cid},cd));await ofLog(full,'Collection added',fmt(rnAmt)+' ('+rpay+') on '+fmtDate(date))}

function openCollection(o,col){
  const edit=!!col,c=col||{},st=ofStat(o),others=st.rec-(edit?c.amountPaise:0),left=o.amountPaise-others;
  if(left<=0){toast('This offer is fully received. Nothing is left to collect.',true);return}
  const s=openSheet(edit?'Edit Collection':'Collect Offer Amount',`<form id="f" novalidate><div class="hint" style="margin:0 0 12px">${esc(o.name)} · ${esc(ofMonthTxt(o))} · remaining ${fmt(left)}</div>
   <div class="row2">${field('date','Collection Date',{type:'date',value:c.date||today(),attrs:'max="'+today()+'"'})}${field('amount','Amount Received (₹)',{value:c.amountPaise?(c.amountPaise/100).toFixed(2):'',attrs:'inputmode="decimal" placeholder="0.00"'})}</div>
   ${paySeg(c.payType)}
   <div id="txnWrap">${field('txn','UPI ID / Transaction ID',{value:c.txnId,attrs:'autocomplete="off" maxlength="60"'})}</div>

   ${field('notes','Notes',{tag:'textarea',value:c.notes,attrs:'maxlength="300"'})}${actionsHtml('Save Collection')}</form>`);
  const sync=()=>{$('#txnWrap',s).style.display=$('input[name=pay]:checked',s).value==='Account'?'':'none'};
  $$('input[name=pay]',s).forEach(i=>i.addEventListener('change',sync));sync();
  bindForm(s,async()=>{
    let ok=true;const date=val(s,'date'),pay=$('input[name=pay]:checked',s).value,txn=val(s,'txn'),rn=val(s,'rno'),notes=val(s,'notes'),amt=parseMoney(val(s,'amount'));
    if(!isoOk(date)||date>today())ok=fail(s,'date','Pick a date that is today or earlier.');
    if(!amt)ok=fail(s,'amount','Enter an amount greater than zero, up to 2 decimals.');
    if(pay==='Account'&&!txn)ok=fail(s,'txn','Enter the UPI ID or transaction ID for account payments.');
    if(!ok)return false;
    const cur=ofStat(data.offers.find(x=>x.id===o.id)||o),lim=o.amountPaise-(cur.rec-(edit?c.amountPaise:0));
    if(amt>lim)return fail(s,'amount','Only '+fmt(lim)+' is left on this offer. Edit the offer amount if more was promised.');

async function hashPin(pin,salt){if(!(window.crypto&&crypto.subtle))throw new Error('PIN needs a secure (https) page.');const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function setPin(pin){const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);await db.doc('meta/safe').set({salt,hash:await hashPin(pin,salt),updatedAt:Date.now()})}

const SZ_T={income:'My Income',expense:'My Expense',lend:'Debt Given',recover:'Debt Recovery',borrow:'Debt Taken',repay:'Debt Repayment'};
const SZ_IC={income:'down',expense:'up',lend:'up',recover:'down',borrow:'down',repay:'up'};
const szSign=t=>(t==='income'||t==='recover'||t==='borrow')?1:-1;   /* effect on cash in hand */
const szSum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amountPaise,0);
function szCalc(list){
  const r={open:szSet.openingPaise||0,inc:szSum(list,'income'),exp:szSum(list,'expense'),lend:szSum(list,'lend'),rec:szSum(list,'recover'),bor:szSum(list,'borrow'),rep:szSum(list,'repay')};
  r.net=r.inc-r.exp-r.lend+r.rec+r.bor-r.rep;r.cash=r.open+r.net;r.given=r.lend-r.rec;r.taken=r.bor-r.rep;return r;
}
const szOrder=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0);
const szPeopleOf=k=>data.sz_people.filter(p=>p.kind===k);
function szStat(p,list){
  const T=(list||data.sz_tx).filter(x=>x.personId===p.id);const a=p.kind==='given'?'lend':'borrow',b=p.kind==='given'?'recover':'repay';
  const tot=szSum(T,a),paid=szSum(T,b),rem=tot-paid;
  return{T,tot,paid,rem,status:tot>0&&rem<=0?'Fully Paid':paid>0?'Partially Paid':'Pending'};
}
const szTag=s=>s==='Fully Paid'?'ok':s==='Partially Paid'?'warn':'bad';
function szHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h).toString(36)}
const szKey=(kind,phone,name)=>(kind==='given'?'g':'t')+'_'+(phone||'n'+szHash(ik(name)));
function szFindPerson(kind,phone,name){const id=szKey(kind,phone,name);return data.sz_people.find(p=>p.id===id)||data.sz_people.find(p=>p.kind===kind&&(phone?p.phone===phone:(!p.phone&&ik(p.name)===ik(name))))}
/* a change is allowed only if no account ends up recovered/repaid more than lent/borrowed */
function szCheck(personId,list){
  const p=data.sz_people.find(x=>x.id===personId);if(!p)return '';
  const s=szStat(p,list);return s.paid>s.tot?'That would leave '+fmt(s.paid)+' paid against only '+fmt(s.tot)+' '+(p.kind==='given'?'lent':'borrowed')+' for '+p.name+'.':'';
}
function szRange(p,from,to){
  const t=today();if(p==='today')return[t,t];if(p==='week')return weekRange(t);
  if(p==='month'){const y=+t.slice(0,4),m=+t.slice(5,7);return[t.slice(0,7)+'-01',t.slice(0,7)+'-'+pad(new Date(y,m,0).getDate())]}
  if(p==='year')return[t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];
  if(p==='custom')return[from||'0000-00-00',to||'9999-12-31'];return['0000-00-00','9999-12-31'];
}
function szLabel(p,from,to){

  if(p==='custom')return (from?fmtDate(from):'Beginning')+' to '+(to?fmtDate(to):fmtDate(today()));

}

views.safe={
  mount(el){this.el=el;this.mode='';this.tab=null;el.onclick=e=>{if(current===views.safe)szClick(e)}},
  update(){
    if(!safeLoaded){if(this.mode!=='load'){this.mode='load';this.el.innerHTML=banner()+'<div class="empty"><b>Loading…</b></div>'}return}
    const mode=!safeMeta?'setup':!safeUnlocked?'enter':'ledger';

function szHistRows(){
  const z=state.sz,r=szRange(z.per,z.from,z.to),q=ik(z.hq),qd=z.hq.replace(/\D/g,'');

    if(!q)return true;const p=x.personId&&data.sz_people.find(y=>y.id===x.personId);

let szPersonOv=null;
async function szClick(e){
  const t=e.target.closest('[data-sz]');if(!t)return;
  const a=t.dataset.sz,id=t.dataset.id,k=t.dataset.k,z=state.sz;
  try{switch(a){
    case 'tab':z.tab=k;views.safe.ledger();window.scrollTo(0,0);break;
    case 'pin':openChangePin();break;
    case 'lock':szLock();break;
    case 'dst':z.dst=k;views.safe.fill();break;
    case 'ft':z.ht=k;z.limit=60;views.safe.fill();break;
    case 'hmore':z.limit+=60;views.safe.fill();break;
    case 'open-bal':openSzOpening();break;
    case 'add-income':openSzPersonal('income');break;
    case 'add-expense':openSzPersonal('expense');break;
    case 'add-given':openSzDebt('given');break;
    case 'add-taken':openSzDebt('taken');break;
    case 'person':openSzPerson(id);break;
    case 'pay':{const p=data.sz_people.find(x=>x.id===id);if(p)openSzPay(p);break}
    case 'more':{const p=data.sz_people.find(x=>x.id===id);if(p)openSzDebt(p.kind,p);break}
    case 'p-edit':{const p=data.sz_people.find(x=>x.id===id);if(p)openSzContact(p);break}
    case 'p-del':await szDelPerson(id);break;
    case 'tx-edit':{const x=data.sz_tx.find(r=>r.id===id);if(x)openSzEdit(x);break}
    case 'tx-del':await szDelTx(id);break;
    case 'pstmt':{const p=data.sz_people.find(x=>x.id===id);if(p)await szExport(()=>szPersonPdf(p),'SafeZone_Statement_'+p.name.replace(/[^\w]+/g,'_')+'.pdf');break}
    case 'hpdf':{const rows=szHistRows().slice().sort(szOrder);await szExport(()=>szListPdf('Transaction History',szFilters.find(f=>f[0]===z.ht)[1]+' | '+szLabel(z.per,z.from,z.to),rows),'SafeZone_History.pdf');break}
    case 'rep':await szReport(k);break;
  }}catch(err){toast((err&&err.message)||'Something went wrong.',true)}
}
async function szExport(build,name){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('The PDF library did not load. Check your internet connection and reload.',true);return}
  let blob;try{blob=build()}catch(err){toast('Could not build the PDF: '+((err&&err.message)||'unknown error'),true);return}
  await saveFile(name,blob);
}

/* new debt (creates the person's account) or an extra amount on an existing account */
function openSzDebt(kind,person){
  const given=kind==='given',type=given?'lend':'borrow',more=!!person;
  const ro=more?' readonly':'';
  const s=openSheet(more?(given?'Lend more':'Borrow more'):(given?'Add Debt Given':'Add Debt Taken'),`<form id="f" novalidate>
   ${field('name','Name',{value:more?person.name:'',attrs:'autocomplete="off" maxlength="80"'+ro})}
   ${field('phone','Phone Number',{type:'tel',value:more?person.phone:'',attrs:'inputmode="numeric" maxlength="16" placeholder="10-digit mobile"'+ro})}
   ${field('wa','WhatsApp Number',{type:'tel',value:more?person.whatsapp:'',attrs:'inputmode="numeric" maxlength="16" placeholder="10-digit mobile"'+ro})}
   <div class="row2">${field('date','Date',{type:'date',value:today(),attrs:'max="'+today()+'"'})}${field('amount','Amount (₹)',{attrs:'inputmode="decimal" placeholder="0.00"'})}</div>
   ${field('notes','Notes',{tag:'textarea',attrs:'maxlength="300"'})}
   ${actionsHtml('Save')}</form>`);
  bindForm(s,async()=>{
    let ok=true;const name=val(s,'name'),ph=val(s,'phone'),wr=val(s,'wa'),date=val(s,'date'),notes=val(s,'notes'),amt=parseMoney(val(s,'amount'));
    if(name.length<2)ok=fail(s,'name','Enter the name.');
    if(ph&&!normPhone(ph))ok=fail(s,'phone','Enter a valid 10-digit mobile number.');
    if(wr&&!normPhone(wr))ok=fail(s,'wa','Enter a valid 10-digit WhatsApp number.');
    if(!isoOk(date)||date>today())ok=fail(s,'date','Pick a date that is today or earlier.');
    if(!amt)ok=fail(s,'amount','Enter an amount greater than zero, up to 2 decimals.');
    if(!ok)return false;
    const phone=ph?normPhone(ph):'',wa=wr?normPhone(wr):'';
    const ex=more?person:szFindPerson(kind,phone,name);const pid=ex?ex.id:szKey(kind,phone,name);
    const d=data.sz_tx.find(x=>x.personId===pid&&x.type===type&&x.date===date&&x.amountPaise===amt&&ik(x.notes||'')===ik(notes));
    if(d)return szDup(s,d);
    if(!ex)await db.doc('sz_people/'+pid).set({kind,name,phone,whatsapp:wa,createdAt:Date.now()});

function openSzPay(p){
  const given=p.kind==='given',type=given?'recover':'repay',st=szStat(p);
  if(st.rem<=0){toast('This account is fully '+(given?'recovered':'repaid')+'. Nothing is left to '+(given?'receive':'pay')+'.',true);return}
  const s=openSheet(given?'Record Payment':'Record Repayment',`<form id="f" novalidate><div class="hint" style="margin:0 0 12px">${esc(p.name)} · remaining ${fmt(st.rem)}</div>
   <div class="row2">${field('date','Date',{type:'date',value:today(),attrs:'max="'+today()+'"'})}${field('amount','Amount (₹)',{attrs:'inputmode="decimal" placeholder="0.00"'})}</div>
   ${field('notes','Notes',{tag:'textarea',attrs:'maxlength="300"'})}${actionsHtml('Save')}</form>`);
  bindForm(s,async()=>{
    let ok=true;const date=val(s,'date'),notes=val(s,'notes'),amt=parseMoney(val(s,'amount'));
    if(!isoOk(date)||date>today())ok=fail(s,'date','Pick a date that is today or earlier.');
    if(!amt)ok=fail(s,'amount','Enter an amount greater than zero, up to 2 decimals.');
    if(!ok)return false;
    const cur=szStat(data.sz_people.find(x=>x.id===p.id)||p);
    if(amt>cur.rem)return fail(s,'amount','Only '+fmt(cur.rem)+' is left on this account.');
    const d=data.sz_tx.find(x=>x.personId===p.id&&x.type===type&&x.date===date&&x.amountPaise===amt&&ik(x.notes||'')===ik(notes));
    if(d)return szDup(s,d);
    await db.doc('sz_tx/'+newId('sz_tx')).set({type,personId:p.id,date,amountPaise:amt,notes,createdAt:Date.now()});
    toast(cur.rem-amt===0?'Fully '+(given?'recovered':'repaid')+'.':'Payment recorded. '+fmt(cur.rem-amt)+' left.');return true;
  },'Save');
}

function weekRange(iso){const a=iso.split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]),k=(d.getDay()+6)%7;const s=new Date(a[0],a[1]-1,a[2]-k),e=new Date(a[0],a[1]-1,a[2]-k+6);return[toIso(s),toIso(e)]}
function periodRange(p,v){
  if(p==='daily'){return{from:v.day,to:v.day,label:fmtDate(v.day)}}
  if(p==='weekly'){const[f,t]=weekRange(v.week);return{from:f,to:t,label:fmtDate(f)+' to '+fmtDate(t)}}
  if(p==='monthly'){const a=v.month.split('-').map(Number),last=new Date(a[0],a[1],0).getDate();return{from:v.month+'-01',to:v.month+'-'+pad(last),label:MONL[a[1]-1]+' '+a[0]}}

function reportData(o){

  const I=data.income.filter(inR).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0)),E=data.expense.filter(inR).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));

/* ---------- backup ---------- */
async function exportBackup(){
  const out={app:'FINANCE',version:1,exportedAt:new Date().toISOString(),counters,settings};COLS.concat(OFF_COLS).forEach(k=>out[k]=data[k]);
  await saveFile('finance-backup-'+today()+'.json',JSON.stringify(out,null,1));
}
async function importBackup(e){
  const f=e.target.files[0];e.target.value='';if(!f||!needDb())return;
  let j;try{j=JSON.parse(await f.text())}catch(err){toast('That file is not a valid backup.',true);return}
  if(!j||j.app!=='FINANCE'||!COLS.some(k=>Array.isArray(j[k]))){toast('That file is not a FINANCE backup.',true);return}
  const have=k=>new Set(data[k].map(x=>x.id));let add=0,skip=0;const todo=[];
  COLS.concat(OFF_COLS).forEach(k=>{const h=have(k);(j[k]||[]).forEach(r=>{if(!r||!r.id||typeof r.id!=='string'){skip++;return}if(h.has(r.id)){skip++;return}todo.push([k,r])})});
  if(!todo.length){toast('Nothing new to import. All '+skip+' records already exist.');return}
  if(!await confirmBox('Import '+todo.length+' new records? '+skip+' existing records will be left unchanged.','Import',false))return;
  toast('Importing…');
  try{for(const[k,r]of todo){const id=r.id;const body=Object.assign({},r);delete body.id;await db.doc(k+'/'+id).set(body);add++}
    if(j.counters){const c=Object.assign({},counters);Object.keys(j.counters).forEach(o=>{if(typeof j.counters[o]==='number')c[o]=Math.max(c[o]||0,j.counters[o])});await db.doc('meta/counters').set(c)}
    toast('Imported '+add+' records.')}
  catch(err){toast('Import stopped after '+add+' records. Run it again to finish; existing records are skipped.',true)}
}
async function wipeAll(){
  if(!needDb())return;
  const s=openSheet('Delete all data',`<p style="margin-top:0">This permanently deletes every income, expense, stock, supporter and offer record, and resets receipt numbers. Export a backup first.</p>${field('wc','Type DELETE to confirm',{attrs:'autocomplete="off"'})}<div class="actions"><button class="btn" data-close>Cancel</button><button class="btn danger fill" id="wgo">Delete everything</button></div>`);
  $('#wgo',s).onclick=async()=>{
    if(val(s,'wc')!=='DELETE'){fail(s,'wc','Type DELETE in capital letters to continue.');return}
    $('#wgo',s).disabled=true;$('#wgo',s).textContent='Deleting…';
    try{for(const k of COLS.concat(OFF_COLS)){for(const r of data[k].slice())await db.doc(k+'/'+r.id).delete()}await db.doc('meta/counters').delete();closeSheet(s);toast('All data deleted.')}
    catch(e){toast('Deleting stopped part-way. Try again.',true);$('#wgo',s).disabled=false;$('#wgo',s).textContent='Delete everything'}
  };
}
